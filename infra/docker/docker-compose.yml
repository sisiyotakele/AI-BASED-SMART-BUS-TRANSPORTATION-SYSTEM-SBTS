version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sbts_user
      POSTGRES_PASSWORD: sbts_password
      POSTGRES_DB: sbts_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbts_user -d sbts_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"
  backend:
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql://sbts_user:sbts_password@postgres:5432/sbts_db?schema=public
      REDIS_HOST: redis
      JWT_SECRET: change-me-in-development-minimum-32-characters
      JWT_REFRESH_SECRET: change-me-refresh-in-development-minimum-32
      AI_SERVICE_URL: http://ai-service:5000
      SOCKET_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    ports:
      - "4000:4000"
  ai-service:
    build:
      context: ../../apps/ai-service
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
  passenger-app:
    build:
      context: ../../apps/passenger-app
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:4000
        VITE_SOCKET_URL: http://localhost:4000
    ports:
      - "5175:5175"

